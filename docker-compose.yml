# GoBiz - full local stack (all components open source). In Docker Desktop it appears as one project: "gobiz".
#   docker compose up --build                       -> app on http://localhost:8080 (API docs: /docs)
#   docker compose --profile graph up --build       -> + Neo4j knowledge graph (http://localhost:7474)
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up   -> Ollama on the NVIDIA GPU
#
# 3 containers: gobiz-app (React UI + FastAPI), gobiz-mysql (data), gobiz-ollama (local LLM).
# The 4th, gobiz-neo4j, starts only with --profile graph.

name: gobiz

services:
  app:
    build: .
    container_name: gobiz-app
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://gobiz:${MYSQL_PASSWORD:-gobiz}@mysql:3306/gobiz?charset=utf8mb4
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}   # downloaded automatically on first start (~1.4 GB)
      EMBEDDINGS_BACKEND: ${EMBEDDINGS_BACKEND:-sentence-transformers}
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-gobiz-graph}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8000"
    volumes:
      - hf_models:/models        # embedding model cache (downloaded once, ~470 MB)
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_started
      neo4j:
        condition: service_healthy
        required: false          # only when started with --profile graph

  mysql:
    image: mysql:8.4
    container_name: gobiz-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gobiz
      MYSQL_USER: gobiz
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gobiz}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gobiz-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3307:3306"   # 3307 on the host to avoid clashing with a local MySQL
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-gobiz-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama:
    image: ollama/ollama:latest
    container_name: gobiz-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m          # keep the model loaded between requests
      OLLAMA_NUM_PARALLEL: "1"        # 4 GB VRAM: one request at a time
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  neo4j:
    image: neo4j:5.26-community   # 5.26 LTS
    container_name: gobiz-neo4j
    profiles: ["graph"]
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-gobiz-graph}
      NEO4J_server_memory_heap_max__size: 1G   # fits next to everything else in 16 GB RAM
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-gobiz-graph} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

volumes:
  mysql_data:
  ollama_data:
  hf_models:
  uploads:
  neo4j_data:
