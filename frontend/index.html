<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GoBiz connects student skills with real company problems: micro-projects, internships and jobs." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GoBiz</title>
    <script>
      // light by default; apply a saved dark choice before first paint (no flash)
      try {
        if (localStorage.getItem("gobiz-theme") === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
