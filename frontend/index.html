<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SkillSync - Match făcut. Proiect început. Studenți și firme mici își dau swipe pentru micro-proiecte, stagii și joburi. Students and small companies swipe right on each other." />
    <meta name="theme-color" content="#1d4e89" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SkillSync · Match făcut. Proiect început.</title>
    <script>
      // light by default; apply a saved dark choice before first paint (no flash). Same for the language.
      try {
        if (localStorage.getItem("skillsync-theme") === "dark") document.documentElement.classList.add("dark");
        var lang = localStorage.getItem("skillsync-lang") || (navigator.language.toLowerCase().indexOf("ro") === 0 ? "ro" : "en");
        document.documentElement.lang = lang === "ro" ? "ro" : "en";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
